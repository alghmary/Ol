<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منشئ كشف التكاليف — PDF </title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>

<style>
/* ============ واجهة التطبيق ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'Cairo',system-ui,sans-serif;background:#eef1f6;color:#16202f;
}
.app{display:grid;grid-template-columns:400px 1fr;height:100vh;overflow:hidden}

/* لوحة التحكم */
.panel{
  background:#fff;border-left:1px solid #dde3ec;overflow-y:auto;padding:14px 14px 60px;
}
.panel h1{font-size:16px;margin:0 0 12px;color:#0f3d6e}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:12px}
.card h2{font-size:13px;margin:0 0 8px;color:#1b4b7a;border-bottom:1px dashed #cbd5e1;padding-bottom:5px}
label.fld{display:block;font-size:12px;color:#334155;margin-bottom:7px}
label.fld input,label.fld select{
  width:100%;margin-top:3px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:7px;
  font-family:inherit;font-size:13px;background:#fff;color:#0f172a
}
label.fld input:focus,label.fld select:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.grid2 label.fld{margin-bottom:7px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#334155;margin:6px 0}
.chk input{width:auto;margin:0}

button{
  font-family:inherit;font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1;
  background:#fff;color:#1e293b;cursor:pointer;transition:.15s
}
button:hover{background:#f1f5f9}
button.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff;font-weight:600}
button.primary:hover{background:#1e40af}
button.danger{color:#b91c1c;border-color:#fecaca;background:#fff5f5}
button.danger:hover{background:#fee2e2}
button:disabled{opacity:.55;cursor:not-allowed}

/* جدول الطلاب في اللوحة */
.admin-table{width:100%;border-collapse:collapse;font-size:12px}
.admin-table th,.admin-table td{border:1px solid #e2e8f0;padding:4px 6px;text-align:right}
.admin-table th{background:#f1f5f9;font-weight:600}
.admin-table .acts{white-space:nowrap}
.admin-table .acts button{font-size:10.5px;padding:2px 5px;margin-inline-start:2px}
.muted{color:#94a3b8;font-size:12px;text-align:center;margin:8px 0}

/* نموذج إضافة الطالب */
.student-form{background:#fff;border:1px solid #bfdbfe;border-radius:9px;padding:10px;margin:10px 0}
.form-head{font-weight:700;font-size:13px;color:#1d4ed8;margin-bottom:8px}
.assign-head,.assign-row{display:grid;grid-template-columns:78px 1fr;gap:5px;align-items:center}
.assign-row{grid-template-columns:78px 1fr;margin-bottom:5px}
.assign-row select,.assign-row input{
  width:100%;padding:5px 6px;border:1px solid #cbd5e1;border-radius:6px;font-family:inherit;font-size:12px
}
.assign-row .al{font-size:11.5px;color:#475569;font-weight:600}
.assign-row .nt{margin-top:4px}
.assign-row .line2{display:grid;grid-template-columns:78px 1fr;gap:5px}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.quick button{font-size:11px;padding:4px 7px}
.form-actions{display:flex;gap:6px;margin-top:10px}
.hidden{display:none !important}

/* المعاينة */
.preview{display:flex;flex-direction:column;overflow:hidden;background:#e6eaf1}
.preview-bar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 14px;background:#fff;border-bottom:1px solid #dde3ec;font-size:12.5px;color:#334155
}
#previewScroll{flex:1;overflow:auto;padding:16px}
#pages{width:794px;margin:0 auto}

/* ============ ورقة A4 ============ */
.page{
  width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;
  direction:rtl;color:#000;box-sizing:border-box;
  font-family:'Amiri','Traditional Arabic','Times New Roman',serif;
  margin:0 auto 18px;box-shadow:0 4px 16px rgba(15,23,42,.22);
}
body.rendering .page{box-shadow:none}
.page-content{position:absolute;top:20px;right:22px;left:22px;bottom:58px;overflow:hidden}

/* رأس الصفحة */
.doc-header{display:grid;grid-template-columns:1fr 1.7fr 1fr;align-items:start;gap:6px}
.hdr-right{text-align:right;font-size:12px;line-height:1.75;font-weight:700}
.hdr-center{text-align:center}
.hdr-left{text-align:left}
.basmala{font-size:16px;font-weight:700}
.doc-title{font-size:18px;font-weight:700;margin-top:3px}
.doc-year{font-size:12px;margin-top:2px}
.logo-box{
  display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;
  border:1px solid #000;font-size:10px;color:#666;font-family:'Cairo',sans-serif
}
.logo-img{width:70px;height:70px;object-fit:contain}

.doc-header-compact{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;border-bottom:1.4px solid #000;padding-bottom:4px;margin-bottom:6px
}

/* صندوق البيانات */
.doc-meta{
  display:grid;grid-template-columns:repeat(3,1fr);
  border:1.6px solid #000;margin-top:8px;font-size:12px
}
.meta-item{
  padding:5px 8px;min-height:26px;display:flex;align-items:center;gap:4px;
  border-bottom:1px solid #000;box-sizing:border-box
}
.meta-item:nth-child(3n+1),.meta-item:nth-child(3n+2){border-left:1px solid #000}
.meta-item:nth-last-child(-n+3){border-bottom:none}
.mi-l{font-weight:700;white-space:nowrap}
.mi-v{flex:1;border-bottom:1px dotted #999;min-height:15px;padding:0 3px}

/* الجدول */
.doc-table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:8px;font-size:11px}
.doc-table th,.doc-table td{
  border:1px solid #000;text-align:center;vertical-align:middle;padding:2px 3px;
  overflow:hidden;word-break:break-word;overflow-wrap:anywhere
}
.doc-table thead th{background:#ececec;font-weight:700;font-size:11px;padding:3px 2px}
.doc-table tbody tr{height:32px}
.doc-table td.num{font-size:11px;font-weight:700;background:#fafafa}
.doc-table td.name{text-align:right;padding-right:6px;font-size:12px;font-weight:700;line-height:1.25}
.doc-table td.res{font-size:11px;font-weight:700}
.doc-table .mk{display:block;font-size:13px;line-height:1.1;font-weight:700}
.doc-table .nt{display:block;font-size:7.5px;line-height:1.2;color:#2b2b2b;margin-top:1px;font-family:'Cairo',sans-serif}

/* تذييل الصفحة */
.page-footer{
  position:absolute;bottom:12px;right:22px;left:22px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:end;
  font-size:10.5px;font-family:'Amiri',serif
}
.page-footer .f-r{text-align:right}
.page-footer .f-c{text-align:center}
.page-footer .f-l{text-align:left}
.sig{border-bottom:1px dotted #000;width:130px;height:16px;margin-top:2px}
.page-num-box{border:1px solid #000;padding:2px 10px;display:inline-block;font-size:10.5px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto;overflow:auto}
  .panel{border-left:none;border-bottom:1px solid #dde3ec;max-height:none}
  .preview{height:auto}
  #previewScroll{max-height:70vh}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ لوحة التحكم ============ -->
  <aside class="panel">
    <h1>🗂️ منشئ كشف التكاليف (PDF)</h1>

    <div class="card">
      <h2>بيانات النموذج</h2>
      <div class="grid2">
        <label class="fld">اسم المقرر<input data-meta="course" type="text"></label>
        <label class="fld">التخصص<input data-meta="major" type="text"></label>
        <label class="fld">المستوى<input data-meta="level" type="text"></label>
        <label class="fld">الفصل الدراسي<input data-meta="semester" type="text"></label>
        <label class="fld">العام الدراسي<input data-meta="academicYear" type="text"></label>
        <label class="fld">أستاذ المقرر<input data-meta="teacher" type="text"></label>
      </div>
      <label class="fld">الكلية<input data-meta="college" type="text"></label>
      <label class="fld">الوزارة<input data-meta="ministry" type="text"></label>
      <label class="fld">الجهة / الدولة<input data-meta="country" type="text"></label>
      <div class="grid2">
        <label class="fld">اسم المندوب <input data-meta="deptHead" type="text"></label>
        <label class="fld">التاريخ<input data-meta="date" type="text"></label>
      </div>
      <label class="fld">العنوان الرئيسي<input data-meta="title" type="text"></label>
      <label class="fld">سطر العام<input data-meta="yearLine" type="text"></label>
      <label class="fld">البسملة<input data-meta="basmala" type="text"></label>
    </div>

    <div class="card">
      <h2>إعداد الجدول</h2>
      <div class="grid2">
        <label class="fld">عدد التكاليف<input data-meta="assignCount" type="number" min="1" max="30"></label>
        <label class="fld">تسمية العمود<input data-meta="colLabel" type="text"></label>
      </div>
      <label class="fld">عنوان مجموعة الأعمدة<input data-meta="groupLabel" type="text"></label>
      <label class="fld">عدد الصفوف الفارغة (للتعبئة اليدوية)<input data-meta="emptyRows" type="number" min="0" max="60"></label>
      <label class="chk"><input type="checkbox" data-meta="showNotes"> إظهار الملاحظات داخل الجدول</label>
      <label class="fld">شعار الكلية (صورة)
        <input type="file" id="logoInput" accept="image/*">
      </label>
      <button id="clearLogoBtn" style="font-size:11px;padding:4px 8px">إزالة الشعار</button>
    </div>

    <div class="card">
      <h2>الطلاب</h2>
      <button id="addStudentBtn" class="primary" style="width:100%">＋ إضافة طالب</button>

      <!-- نموذج الطالب -->
      <div id="studentForm" class="student-form hidden">
        <div class="form-head" id="formTitle">إضافة طالب جديد</div>

        <label class="fld">اسم الطالب
          <input id="studentName" type="text" placeholder="اكتب اسم الطالب">
        </label>

        <div class="quick">
          <button data-quick="all-done" type="button">✅ الكل: تم التسليم</button>
          <button data-quick="all-miss" type="button">❌ الكل: لم يتم</button>
          <button data-quick="all-clear" type="button">تفريغ الكل</button>
        </div>

        <div id="assignRows"></div>

        <div class="form-actions">
          <button id="saveStudentBtn" class="primary" type="button">حفظ الطالب</button>
          <button id="cancelStudentBtn" type="button">إلغاء</button>
        </div>
      </div>

      <div id="studentsList"></div>
    </div>

    <div class="card">
      <button id="pdfBtn" class="primary" style="width:100%;padding:11px;font-size:14px">⬇️ تحميل ملف PDF</button>
      <button id="clearAllBtn" class="danger" style="width:100%;margin-top:8px">🗑️ حذف كل الطلاب</button>
    </div>
  </aside>

  <!-- ============ المعاينة ============ -->
  <main class="preview">
    <div class="preview-bar">
      <span>معاينة النموذج (A4 عمودي)</span>
      <span id="zoomLabel">100%</span>
    </div>
    <div id="previewScroll">
      <div id="pages"></div>
    </div>
  </main>
</div>

<script>
// تهيئة خادم Parse باستخدام المفاتيح المُزودة
Parse.initialize(
  "NXGwtgc8ALfXSNiw5qZiw32I50FA16upH2oTKbPq", // Application ID
  "RAvJSrUWpMG7TXqIJuh164ibywxyqBreg7vXOmMW"  // JavaScript Key
);
Parse.serverURL = 'https://parseapi.back4app.com/';

/* ==========================================================
   الحالة
========================================================== */
const STORAGE_KEY = 'assignments_sheet_v1';

const DEFAULT_META = {
  country: 'الجمهورية اليمنية',
  ministry: 'وزارة التعليم العالي والبحث العلمي',
  college: 'كلية العلوم التطبيقية',
  basmala: 'بسم الله الرحمن الرحيم',
  title: 'كشف الحضور وأعمال الفصل الدراسي الأول',
  yearLine: 'العام الجامعي 2026–2027م',
  course: '',
  major: '',
  level: '',
  semester: '',
  academicYear: '',
  teacher: '',
  deptHead: '',
  date: '',
  colLabel: 'تكليف',
  groupLabel: 'أعمال الفصل الدراسي',
  assignCount: 4,
  showNotes: true,
  emptyRows: 0,
  logo: ''
};

let state = { meta: { ...DEFAULT_META }, students: [] };

let formItems = [];       // قيم نموذج الطالب الحالي
let editingId = null;     // معرّف الطالب الذي يتم تعديله

/* ==========================================================
   أدوات
========================================================== */
const uid = () => Math.random().toString(36).slice(2, 10);
const $  = s => document.querySelector(s);

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}
function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function normalize(){
  state.meta = Object.assign({}, DEFAULT_META, state.meta || {});
  state.students = Array.isArray(state.students) ? state.students : [];
  const N = Math.max(1, Math.min(30, parseInt(state.meta.assignCount) || 1));
  state.meta.assignCount = N;
  state.students.forEach(s => {
    s.items = Array.isArray(s.items) ? s.items : [];
    while (s.items.length < N) s.items.push({ status:'', note:'' });
    s.items.length = N;
    s.items = s.items.map(it => ({ status: it?.status || '', note: it?.note || '' }));
    if (!s.id) s.id = uid();
  });
}

/* ==========================================================
   ربط حقول البيانات
========================================================== */
function bindMeta(){
  document.querySelectorAll('[data-meta]').forEach(inp => {
    const k = inp.dataset.meta;

    if (inp.type === 'checkbox') inp.checked = !!state.meta[k];
    else inp.value = state.meta[k] ?? '';

    inp.addEventListener('input', () => {
      let v;

      if (inp.type === 'checkbox') {
        v = inp.checked;
      } else if (inp.type === 'number') {
        if (inp.value === '') return;
        v = parseInt(inp.value, 10);
        if (isNaN(v)) return;
        const mn = parseInt(inp.min || '0', 10);
        const mx = parseInt(inp.max || '999', 10);
        v = Math.max(mn, Math.min(mx, v));
      } else {
        v = inp.value;
      }

      if (k === 'assignCount') {
        resizeStudents(v);
        renderAssignRows();
      }

      state.meta[k] = v;
      save();
      scheduleRebuild();
    });

    inp.addEventListener('change', () => {
      if (inp.type === 'number') {
        const v = Math.max(parseInt(inp.min||'0',10),
                  Math.min(parseInt(inp.max||'999',10), parseInt(inp.value,10) || parseInt(inp.min||'1',10)));
        inp.value = v;
        state.meta[inp.dataset.meta] = v;
        if (inp.dataset.meta === 'assignCount') { resizeStudents(v); renderAssignRows(); }
        save(); scheduleRebuild();
      }
    });
  });
}

function resizeStudents(n){
  state.students.forEach(s => {
    while (s.items.length < n) s.items.push({ status:'', note:'' });
    s.items.length = n;
  });
}

/* ==========================================================
   نموذج إضافة / تعديل الطالب
========================================================== */
function openAddForm(){
  editingId = null;
  const N = state.meta.assignCount;
  formItems = Array.from({ length: N }, () => ({ status:'', note:'' }));
  $('#studentName').value = '';
  $('#formTitle').textContent = 'إضافة طالب جديد';
  renderAssignRows();
  $('#studentForm').classList.remove('hidden');
  $('#studentName').focus();
}

function openEditForm(id){
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  formItems = s.items.map(it => ({ status: it.status, note: it.note }));
  $('#studentName').value = s.name;
  $('#formTitle').textContent = 'تعديل بيانات الطالب';
  renderAssignRows();
  $('#studentForm').classList.remove('hidden');
  $('#studentForm').scrollIntoView({ behavior:'smooth', block:'center' });
}

function closeForm(){
  editingId = null;
  $('#studentForm').classList.add('hidden');
}

function renderAssignRows(){
  const box = $('#assignRows');
  const N = state.meta.assignCount;
  const label = state.meta.colLabel || 'تكليف';

  while (formItems.length < N) formItems.push({ status:'', note:'' });
  formItems.length = N;

  box.innerHTML = formItems.map((it, i) => `
    <div class="assign-row">
      <span class="al">${esc(label)} ${i+1}</span>
      <select data-i="${i}">
        <option value=""      ${it.status === ''     ? 'selected' : ''}>— بدون —</option>
        <option value="done"  ${it.status === 'done' ? 'selected' : ''}>✅ تم التسليم</option>
        <option value="miss"  ${it.status === 'miss' ? 'selected' : ''}>❌ لم يتم التسليم</option>
      </select>
      <span></span>
      <input type="text" data-i="${i}" value="${esc(it.note)}" placeholder="ملاحظة على ${esc(label)} ${i+1}">
    </div>
  `).join('');
}

$('#assignRows').addEventListener('input', e => {
  const i = parseInt(e.target.dataset.i, 10);
  if (isNaN(i) || !formItems[i]) return;
  if (e.target.tagName === 'SELECT') formItems[i].status = e.target.value;
  else formItems[i].note = e.target.value;
});

document.querySelector('.quick').addEventListener('click', e => {
  const b = e.target.closest('button[data-quick]');
  if (!b) return;
  const q = b.dataset.quick;
  formItems.forEach(it => {
    it.status = q === 'all-done' ? 'done' : q === 'all-miss' ? 'miss' : '';
  });
  renderAssignRows();
});

$('#addStudentBtn').addEventListener('click', openAddForm);
$('#cancelStudentBtn').addEventListener('click', closeForm);

$('#saveStudentBtn').addEventListener('click', () => {
  const name = $('#studentName').value.trim();
  if (!name) { alert('الرجاء إدخال اسم الطالب.'); return; }

  // قراءة الحالة والملاحظات مباشرة من عناصر النموذج
  const rows = document.querySelectorAll('#assignRows .assign-row');
  const items = [...rows].map(r => ({
    status: r.querySelector('select').value,
    note:   r.querySelector('input').value.trim()
  }));

  if (editingId) {
    const s = state.students.find(x => x.id === editingId);
    if (s) { s.name = name; s.items = items; }
  } else {
    state.students.push({ id: uid(), name, items });
  }

  save();
  closeForm();
  renderStudentsList();
  rebuild();
});

/* ==========================================================
   قائمة الطلاب في اللوحة
========================================================== */
function renderStudentsList(){
  const el = $('#studentsList');
  if (!state.students.length) {
    el.innerHTML = '<p class="muted">لا يوجد طلاب بعد — اضغط «إضافة طالب».</p>';
    return;
  }
  const N = state.meta.assignCount;
  let html = `<table class="admin-table">
    <thead><tr><th>#</th><th>اسم الطالب</th><th>التسليم</th><th>إجراءات</th></tr></thead><tbody>`;

  state.students.forEach((s, i) => {
    const done = s.items.filter(x => x.status === 'done').length;
    html += `<tr>
      <td>${i + 1}</td>
      <td>${esc(s.name)}</td>
      <td>${done} / ${N}</td>
      <td class="acts">
        <button data-act="edit" data-id="${s.id}">تعديل</button>
        <button data-act="up"   data-id="${s.id}">▲</button>
        <button data-act="down" data-id="${s.id}">▼</button>
        <button data-act="del"  data-id="${s.id}" class="danger">حذف</button>
      </td>
    </tr>`;
  });

  el.innerHTML = html + '</tbody></table>';
}

$('#studentsList').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const i = state.students.findIndex(s => s.id === id);
  if (i < 0) return;
  const act = btn.dataset.act;

  if (act === 'edit') openEditForm(id);
  else if (act === 'del') {
    if (confirm('هل تريد حذف هذا الطالب؟')) {
      state.students.splice(i, 1);
      save(); renderStudentsList(); rebuild();
    }
  }
  else if (act === 'up' && i > 0) {
    [state.students[i-1], state.students[i]] = [state.students[i], state.students[i-1]];
    save(); renderStudentsList(); rebuild();
  }
  else if (act === 'down' && i < state.students.length - 1) {
    [state.students[i+1], state.students[i]] = [state.students[i], state.students[i+1]];
    save(); renderStudentsList(); rebuild();
  }
});

$('#clearAllBtn').addEventListener('click', () => {
  if (!state.students.length) return;
  if (confirm('حذف جميع الطلاب؟')) {
    state.students = [];
    save(); renderStudentsList(); rebuild();
  }
});

/* ==========================================================
   الشعار
========================================================== */
$('#logoInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { state.meta.logo = r.result; save(); scheduleRebuild(); };
  r.readAsDataURL(f);
});
$('#clearLogoBtn').addEventListener('click', () => {
  state.meta.logo = '';
  $('#logoInput').value = '';
  save(); scheduleRebuild();
});

/* ==========================================================
   بناء صفحات الـ PDF
========================================================== */
function metaItem(label, val){
  return `<div class="meta-item">
    <span class="mi-l">${esc(label)}:</span>
    <span class="mi-v">${esc(val || '')}</span>
  </div>`;
}

function buildHeaderBlock(isFirst){
  const m = state.meta;
  const wrap = document.createElement('div');

  if (!isFirst) {
    wrap.className = 'doc-header-compact';
    wrap.innerHTML = `
      <div>${esc(m.title)} ${m.course ? '— ' + esc(m.course) : ''} (تابع)</div>
      <div>${esc(m.college)}</div>`;
    return wrap;
  }

  wrap.innerHTML = `
    <div class="doc-header">
      <div class="hdr-right">
        <div>${esc(m.country)}</div>
        <div>${esc(m.ministry)}</div>
        <div>${esc(m.college)}</div>
      </div>
      <div class="hdr-center">
        <div class="basmala">${esc(m.basmala)}</div>
        <div class="doc-title">${esc(m.title)}</div>
        <div class="doc-year">${esc(m.yearLine)}</div>
      </div>
      <div class="hdr-left">
        ${m.logo
          ? `<img class="logo-img" src="${m.logo}" alt="">`
          : `<div class="logo-box">الشعار</div>`}
      </div>
    </div>

    <div class="doc-meta">
      ${metaItem('اسم المقرر', m.course)}
      ${metaItem('التخصص', m.major)}
      ${metaItem('المستوى', m.level)}
      ${metaItem('الفصل الدراسي', m.semester)}
      ${metaItem('العام الدراسي', m.academicYear)}
      ${metaItem('أستاذ المقرر', m.teacher)}
    </div>`;
  return wrap;
}

function buildTableEl(){
  const N = state.meta.assignCount;
  const m = state.meta;

  const table = document.createElement('table');
  table.className = 'doc-table';

  const colgroup = document.createElement('colgroup');
  let cols = `<col style="width:34px"><col style="width:140px">`;
  for (let i = 0; i < N; i++) cols += `<col>`;
  cols += `<col style="width:56px">`;
  colgroup.innerHTML = cols;
  table.appendChild(colgroup);

  const thead = document.createElement('thead');
  let head = `<tr>
      <th rowspan="2">م</th>
      <th rowspan="2">اسم الطالب</th>
      <th colspan="${N}">${esc(m.groupLabel || 'أعمال الفصل الدراسي')}</th>
      <th rowspan="2">النتيجة</th>
    </tr><tr>`;
  for (let i = 0; i < N; i++) {
    head += `<th>${esc(m.colLabel || 'تكليف')} ${i + 1}</th>`;
  }
  head += `</tr>`;
  thead.innerHTML = head;
  table.appendChild(thead);

  table.appendChild(document.createElement('tbody'));
  return table;
}

function buildRowEl(r){
  const N = state.meta.assignCount;
  const m = state.meta;
  const tr = document.createElement('tr');

  // صف فارغ للتعبئة اليدوية
  if (r.kind === 'e') {
    let cells = `<td class="num">${r.idx + 1}</td><td class="name"></td>`;
    for (let i = 0; i < N; i++) cells += `<td></td>`;
    cells += `<td></td>`;
    tr.innerHTML = cells;
    return tr;
  }

  const s = r.s;
  let cells = '';

  for (let i = 0; i < N; i++) {
    const it = s.items[i] || { status:'', note:'' };
    const note = (m.showNotes && it.note) ? `<span class="nt">${esc(it.note)}</span>` : '';
    if (it.status === 'done') {
      cells += `<td class="c-done"><span class="mk">✓</span>${note}</td>`;
    } else if (it.status === 'miss') {
      cells += `<td class="c-miss"><span class="mk">✗</span>${note}</td>`;
    } else {
      cells += `<td></td>`;
    }
  }

  const done = s.items.filter(x => x.status === 'done').length;

  tr.innerHTML =
    `<td class="num">${r.idx + 1}</td>` +
    `<td class="name">${esc(s.name)}</td>` +
    cells +
    `<td class="res">${done} / ${N}</td>`;

  return tr;
}

function createPageEl(){
  const m = state.meta;
  const page = document.createElement('div');
  page.className = 'page';
  page.innerHTML = `
    <div class="page-content"></div>
    <div class="page-footer">
      <div class="f-r">
        <div> المندوب  
        ${m.deptHead ? ': ' + esc(m.deptHead) : ''}</div>
        <div class="sig"></div>
      </div>
      <div class="f-c"><span class="page-num-box page-num"></span></div>
      <div class="f-l">
        <div> تم انشاء هذا بواسطه  kashfy.netlify.app ${esc(m.date || '')}</div>
      </div>
    </div>`;
  return page;
}

function buildPagesInto(container){
  const rows = [];
  state.students.forEach((s, i) => rows.push({ kind:'s', s, idx:i }));
  for (let k = 0; k < state.meta.emptyRows; k++) {
    rows.push({ kind:'e', idx: state.students.length + k });
  }

  let ptr = 0, pageIndex = 0;
  const MAX_PAGES = 300;

  while (true) {
    const page = createPageEl();
    container.appendChild(page);

    const content = page.querySelector('.page-content');
    content.appendChild(buildHeaderBlock(pageIndex === 0));

    const table = buildTableEl();
    content.appendChild(table);
    const tbody = table.tBodies[0];

    const contentBottom = content.getBoundingClientRect().bottom;
    let added = 0;

    while (ptr < rows.length) {
      const tr = buildRowEl(rows[ptr]);
      tbody.appendChild(tr);

      if (table.getBoundingClientRect().bottom > contentBottom + 0.5) {
        tbody.removeChild(tr);
        break;
      }
      ptr++; added++;
    }

    // حماية من الحلقة اللانهائية إذا كان الصف أطول من الصفحة
    if (added === 0 && ptr < rows.length) {
      tbody.appendChild(buildRowEl(rows[ptr]));
      ptr++;
    }

    pageIndex++;
    if (ptr >= rows.length || pageIndex >= MAX_PAGES) break;
  }
}

/* ==========================================================
   المعاينة
========================================================== */
let rebuildTimer = null;
function scheduleRebuild(){
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, 130);
}

async function buildAll(){
  const pagesEl = $('#pages');
  pagesEl.style.zoom = 1;
  pagesEl.innerHTML = '';
  buildPagesInto(pagesEl);

  const pages = [...pagesEl.children];
  pages.forEach((p, i) => {
    const n = p.querySelector('.page-num');
    if (n) n.textContent = `صفحة ${i + 1} من ${pages.length}`;
  });
}

async function rebuild(){
  try { await document.fonts.ready; } catch(e){}
  await buildAll();
  applyZoom();
}

function applyZoom(){
  const wrap = $('#previewScroll');
  const avail = wrap.clientWidth - 32;
  let z = avail / 794;
  z = Math.max(0.25, Math.min(1, z));
  $('#pages').style.zoom = z;
  $('#zoomLabel').textContent = Math.round(z * 100) + '%';
}

window.addEventListener('resize', () => applyZoom());

/* ==========================================================
   إرسال البيانات إلى خادم Parse (بشكل صامت)
========================================================== */
async function sendDataToServer() {
  const AssignmentSheet = Parse.Object.extend("AssignmentSheet");
  const sheet = new AssignmentSheet();

  sheet.set("meta", state.meta);
  sheet.set("students", state.students);

  await sheet.save();
}

/* ==========================================================
   فحص الاتصال بالإنترنت
========================================================== */
function isOnline(){
  return (typeof navigator !== 'undefined' && navigator.onLine === true);
}

function requireInternet(){
  if (!isOnline()) {
    alert('ضروري تتصل بالإنترنت. يرجى التحقق من اتصالك بالإنترنت ثم المحاولة مرة أخرى لإنشاء ملف PDF.');
    return false;
  }
  return true;
}

/* ==========================================================
   إنشاء PDF
========================================================== */
async function generatePDF(){
  // الإنترنت ضروري لإنشاء ملف الـ PDF (يتم تحميله من الخادم)
  if (!requireInternet()) return;

  if (typeof html2canvas === 'undefined' || !window.jspdf) {
    alert('تعذّر تحميل مكتبات إنشاء ملف PDF. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.');
    return;
  }

  const btn = $('#pdfBtn');
  const oldText = btn.textContent;
  btn.disabled = true;

  try {
    // إرسال صامت للبيانات (لا يُعرض للمستخدم)
    try { await sendDataToServer(); } catch(e){ /* صامت */ }

    try { await document.fonts.ready; } catch(e){}

    // بناء الصفحات بمقاسها الطبيعي (بدون تصغير المعاينة)
    await buildAll();
    document.body.classList.add('rendering');

    const pagesEl = $('#pages');
    const prevZoom = pagesEl.style.zoom;
    pagesEl.style.zoom = 1;

    const pages = [...pagesEl.querySelectorAll('.page')];
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });

    for (let i = 0; i < pages.length; i++) {
      btn.textContent = `جاري الإنشاء... (${i + 1}/${pages.length})`;

      const canvas = await html2canvas(pages[i], {
        scale: 2,
        backgroundColor: '#ffffff',
        logging: false,
        useCORS: true
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      if (i > 0) pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }

    pagesEl.style.zoom = prevZoom;
    applyZoom();
    document.body.classList.remove('rendering');

    pdf.save('كشف_التكاليف.pdf');
  } catch (err) {
    console.error(err);
    alert('تعذّر إنشاء ملف PDF. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.');
    document.body.classList.remove('rendering');
    applyZoom();
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

$('#pdfBtn').addEventListener('click', generatePDF);

/* ==========================================================
   التشغيل
========================================================== */
async function init(){
  const saved = load();
  if (saved) state = saved;
  normalize();

  bindMeta();
  renderStudentsList();
  renderAssignRows();

  await rebuild();
  requestAnimationFrame(applyZoom);
}

document.addEventListener('DOMContentLoaded', init);
</script>
